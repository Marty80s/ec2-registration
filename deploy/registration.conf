<VirtualHost *:80>
    WSGIDaemonProcess registration user=www-data group=www-data threads=5 python-path=/var/www/ec2-registration
    WSGIProcessGroup registration
    WSGIScriptAlias / /var/www/ec2-registration/wsgi.py
    <Directory /var/www/ec2-registration>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/registration-error.log
    CustomLog ${APACHE_LOG_DIR}/registration-access.log combined
</VirtualHost>
