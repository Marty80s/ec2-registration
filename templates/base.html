<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Account portal{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><a class="brand" href="{{ url_for('register') }}">Account portal<span>YOUR PERSONAL SPACE</span></a><nav>{% if session.get('user_id') %}<a href="{{ url_for('profile') }}">My profile</a><form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="link" type="submit">Log out</button></form>{% else %}<a href="{{ url_for('register') }}">Register</a><a href="{{ url_for('login') }}">Log in</a>{% endif %}</nav></header>
<main>{% for category, message in get_flashed_messages(with_categories=true) %}<div class="notice {{ category }}" role="alert">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><footer>Your details and document, together in one place.</footer></body></html>
